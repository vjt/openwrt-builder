# Default OpenWrt SDK version(s). Accepts a single string or a list. Each repo
# builds once per version in its own list (or this default). Versions differ
# by package format: <= 24.10 emits .ipk, >= 25.12 emits .apk.
openwrt_versions: "24.10.0"

default_targets:
  - mediatek/filogic       # covers MT7981, MT7986, MT7988
  - bcm27xx/bcm2709
  - ramips/mt7621
  - ath79/tiny

poll_interval: 3600  # seconds
sdk_force: false     # set true on case-insensitive filesystems (macOS)

# Hetzner on-demand build servers (optional, for ARM hosts that can't run x86_64 SDK)
# Requires: runtime/hetzner.token with API token, SSH key registered in Hetzner console
# hetzner:
#   ssh_key_name: "openwrt-builder"  # name of SSH key in Hetzner Cloud
#   server_type: "cx23"               # 2 vCPU, 4GB RAM, cheapest x86 shared
#   location: "fsn1"                 # Falkenstein datacenter

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

repos:
  - name: my-lua-package
    url: git@github.com:you/my-lua-package.git
    branch: main
    targets: [all]              # arch-independent (Lua/config only)

  - name: my-c-package
    url: git@github.com:you/my-c-package.git
    branch: main
    # inherits default_targets

  - name: dual-version-package
    url: git@github.com:you/dual-version-package.git
    branch: main
    openwrt_versions: ["24.10.0", "25.12.0"]
    targets: [all]
