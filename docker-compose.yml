services:
  feed-server:
    image: nginx:alpine
    volumes:
      - ./runtime/feed:/feed:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    restart: unless-stopped

  builder:
    build: ./builder
    volumes:
      - ./runtime/feed:/feed
      - ./runtime/sdk:/opt/sdk
      - ./runtime/repos:/opt/repos
      - ./runtime/ssh.key:/root/.ssh/builder.key:ro
      - ./runtime/config.yaml:/etc/openwrt-builder/config.yaml:ro
    environment:
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
    restart: unless-stopped
