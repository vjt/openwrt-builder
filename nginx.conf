server {
    listen 80;
    server_name _;

    root /feed;

    location / {
        autoindex on;
    }

    # apk fetches a package from <repo>/<package arch>/<file>, so noarch
    # packages listed in a per-arch APKINDEX are requested under /noarch/.
    # They live in /all/ (targets: [all] builds).
    location ~ ^/noarch/([^/]+\.apk)$ {
        try_files /all/$1 =404;
    }
}
